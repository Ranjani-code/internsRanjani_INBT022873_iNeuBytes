<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Details - MediCare Health Centre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container nav">
        <a href="index.html" class="logo">
            <span>+</span> MediCare
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="doctors.html">Doctors</a>
            <a href="booking.html">Appointment</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </div>
</header>

<main>

    <section class="page-header">
        <div class="container">
            <p class="small-title">DOCTOR PROFILE</p>
            <h1 id="doctorPageTitle">Doctor Details</h1>
        </div>
    </section>

    <section class="section">
        <div class="container doctor-profile">

            <div class="profile-avatar" id="doctorAvatar">DR</div>

            <div class="profile-content">
                <p class="small-title" id="doctorDepartment">
                    SPECIALIST
                </p>

                <h2 id="doctorName">Doctor Name</h2>

                <p id="doctorExperience"></p>

                <p id="doctorDescription"></p>

                <div class="profile-details">
                    <div>
                        <strong>Availability</strong>
                        <p id="doctorDays"></p>
                    </div>

                    <div>
                        <strong>Consultation Time</strong>
                        <p id="doctorTime"></p>
                    </div>
                </div>

                <a id="bookDoctor" href="booking.html" class="btn">
                    Book Appointment
                </a>
            </div>

        </div>
    </section>

</main>

<footer>
    <div class="container footer-content">
        <div>
            <a href="index.html" class="logo">
                <span>+</span> MediCare
            </a>
            <p>Quality healthcare for you and your family.</p>
        </div>

        <p>© 2026 MediCare Health Centre</p>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
